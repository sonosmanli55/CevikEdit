name: Release

# Builds the Windows installer and the tiny bootstrap launcher on a tag, then
# publishes them as release assets. The bootstrap asset name must match the one
# the landing page and the app's updater expect.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # electron-builder needs icon.ico; it is committed, so no icon build here.
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Build bootstrap launcher
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ `
            /out:"release\CevikEdit-Kurucu.exe" /win32icon:"build\icon.ico" `
            /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll `
            bootstrap\CevikEditSetup.cs
          if (-not (Test-Path "release\CevikEdit-Kurucu.exe")) { throw "bootstrap missing" }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/CevikEdit Setup*.exe
            release/CevikEdit Setup*.exe.blockmap
            release/latest.yml
            release/CevikEdit-Kurucu.exe
          generate_release_notes: true
