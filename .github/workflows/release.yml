name: Release

# Builds the Windows installer and the tiny bootstrap launcher on a tag (or on
# demand), then publishes them as release assets with stable file names:
#   CevikEdit-Kurulum.exe  – the real NSIS installer the app/landing page link to
#   CevikEdit-Kurucu.exe   – the ~200 KB launcher that fetches the installer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # electron-builder needs build/icon.ico; it is committed, so no icon build.
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Stage stable asset names
        shell: pwsh
        run: |
          $setup = Get-ChildItem "release\CevikEdit Setup *.exe" | Where-Object { $_.Name -notmatch "uninstaller" } | Select-Object -First 1
          if (-not $setup) { throw "installer missing" }
          Copy-Item $setup.FullName "release\CevikEdit-Kurulum.exe" -Force
          if (Test-Path "$($setup.FullName).blockmap") {
            Copy-Item "$($setup.FullName).blockmap" "release\CevikEdit-Kurulum.exe.blockmap" -Force
          }
      - name: Build bootstrap launcher
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ `
            /out:"release\CevikEdit-Kurucu.exe" /win32icon:"build\icon.ico" `
            /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll `
            bootstrap\CevikEditSetup.cs
          if (-not (Test-Path "release\CevikEdit-Kurucu.exe")) { throw "bootstrap missing" }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/CevikEdit-Kurulum.exe
            release/CevikEdit-Kurulum.exe.blockmap
            release/CevikEdit-Kurucu.exe
          generate_release_notes: true
